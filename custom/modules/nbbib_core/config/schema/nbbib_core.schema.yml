# Schema for the configuration files of the nbbib_core module.

nbbib_core.settings:
  type: config_object
  label: 'NBBIB Core settings'
  mapping:
    status:
      type: boolean
      label: 'Status'
    id:
      type: string
      label: 'ID'
    Label:
      type: label
      label: 'Label'
    module:
      type: string
      label: 'Module'
    description:
      type: text
      label: 'Description'
    core:
      type: string
      label: 'Core version'
    langcode:
      type: string
      label: 'Language code'
    nbbib_types:
      type: sequence
      label: 'NBBIB bibliography types'
      sequence:
        type: mapping
        label: 'Bibliography type'
        mapping:
          entity:
            type: string
            label: 'Entity type ID'
          singular:
            type: label
            label: 'Singular label'
          plural:
            type: label
            label: 'Plural label'
          label:
            type: label
            label: 'Label'
    view_headers:
      type: mapping
      label: 'View header texts'
      mapping:
        nbbib_essays:
          type: text
          label: 'NBBIB Essays view header'